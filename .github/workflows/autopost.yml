name: Auto Post to TikTok

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем FFmpeg и зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Запуск генерации и публикации
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: python -u main.py

      - name: Сохраняем готовое видео (на случай ошибки выгрузки в TikTok)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output.mp4
          if-no-files-found: ignore
